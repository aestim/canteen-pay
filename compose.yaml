# Local development database. Start: docker compose up -d   Stop: docker compose down
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: canteenpay
      POSTGRES_USER: canteenpay
      POSTGRES_PASSWORD: canteenpay-dev-only
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteenpay -d canteenpay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
